<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="./manifest.json" />
    <title>Mazal Distribuidora de productos desechables, plásticos y comestibles</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
      }
      .loading-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-xkIqn3SZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-agv0E-Ok.css">
  </head>
  <body>
    <div id="root">
      <div class="loading-container">
        <div class="spinner"></div>
        <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 6px 0; color: #f8fafc;">Mazal Distribuidora</h2>
        <p style="font-size: 13px; color: #94a3b8; margin: 0;">Iniciando sistema...</p>
      </div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Clear any stale caches from older build versions
          if (window.caches) {
            caches.keys().then((names) => {
              for (const name of names) {
                if (name !== 'mazal-pos-v15-universal-sync') {
                  console.log('Purging legacy cache:', name);
                  caches.delete(name);
                }
              }
            }).catch(() => {});
          }

          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              reg.update().catch(() => {});
            })
            .catch(() => {
              // Non-blocking in dev / environments without sw.js
            });
        });
      }
    </script>
  </body>
</html>
